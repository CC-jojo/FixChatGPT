name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # 允许附加构建产物到 Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: >
          dotnet publish src/FixChatGPT/FixChatGPT.csproj
          -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - name: Smoke test (exe exists)
        shell: pwsh
        run: |
          if (-not (Test-Path "out/FixChatGPT.exe")) { throw "构建产物缺失" }
          Get-Item "out/FixChatGPT.exe" | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FixChatGPT
          path: out/FixChatGPT.exe
          if-no-files-found: error

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/FixChatGPT.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
